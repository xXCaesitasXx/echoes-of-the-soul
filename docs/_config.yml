title: My Magic System
description: A reference wiki for the rune magic system.

# TODO: set baseurl to "/YOUR-REPO-NAME" (keep the leading slash) and url to your Pages host.
url: https://xXCaesitasXx.github.io
baseurl: /echoes-of-the-soul

remote_theme: mmistakes/minimal-mistakes@4.26.2
color_scheme: dark
search_enabled: true
heading_anchors: true

plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-include-cache

# Lets links like [Runes](runes/index.md) work on the built site.
relative_links:
  enabled: true
  collections: false

defaults:
  - scope:
      path: ""
    values:
      layout: single
      sidebar:
        nav: "docs"
      toc: true
      toc_label: "On this page"
      toc_icon: "scroll"

# Templates are copy-paste sources, not site pages.
exclude:
  - templates/
