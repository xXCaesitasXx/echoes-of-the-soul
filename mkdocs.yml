site_name: My Magic System
site_description: A reference wiki for the rune magic system.
# TODO: set these to your GitHub username and repo name
site_url: https://xXCaesitasXx.github.io/echoes-of-the-soul/
repo_url: https://github.com/xXCaesitasXx/echoes-of-the-soul
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit

extra_css:
  - assets/css/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

# Templates are copy-paste sources, not site pages.
exclude_docs: |
  templates/

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Core Concepts:
      - core-concepts/index.md
      - Source of Magic: core-concepts/source-of-magic.md
      - Rank and Fusion: core-concepts/rank-and-fusion.md
      - Rules and Limits: core-concepts/rules-and-limits.md
      - Costs and Consequences: core-concepts/costs-and-consequences.md
      - Terminology: core-concepts/terminology.md
  - Runes:
      - runes/index.md
      - Rank 1:
          - Example Rune: runes/rank-1/example-rune.md
  - Fusions:
      - fusions/index.md
      - Example Fusion: fusions/example-fusion.md
  - Builds: builds/index.md
  - Practitioners: practitioners/index.md
  - Lore:
      - lore/index.md
      - Timeline: lore/timeline.md
  - Mechanics:
      - mechanics/index.md
      - Casting: mechanics/casting.md
      - Progression: mechanics/progression.md
  - Reference:
      - Glossary: reference/glossary.md
      - Changelog: reference/changelog.md
      - Open Questions: reference/open-questions.md
